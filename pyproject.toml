[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "stigmergic"
version = "0.1.0"
description = "A near-zero-dependency, fault-tolerant multi-agent framework built on Stigmergy, Latent State Transfer, and a Byzantine-inspired consensus quorum."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Stigmergic Contributors" }]
keywords = [
    "multi-agent",
    "stigmergy",
    "swarm-intelligence",
    "byzantine-fault-tolerance",
    "latent-state-transfer",
    "eventual-consistency",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

# Horizon 1 (Stigmergic Swarms) relies only on the standard library plus
# pydantic. The heavy cognitive horizons are opt-in via extras so that
# `import stigmergic` never pays the torch/transformers import tax.
dependencies = [
    "pydantic>=2.0",
]

[project.optional-dependencies]
# Horizon 2 (Byzantine Cognitive Consensus) and Horizon 3 (Latent State
# Transfer) require the deep-learning stack. Install with:
#   pip install -e ".[cognition]"
cognition = [
    "torch>=2.0",
    "transformers>=4.40",
    # The default cross-encoder (DeBERTa-v3) uses a SentencePiece tokenizer, so
    # torch + transformers alone are not enough -- without these, `--nli` would
    # crash at model load. (A BPE model via `--nli-model` needs neither.)
    "sentencepiece>=0.1.99",
    "protobuf>=3.20",
]
# A production Pheromone Ground on PostgreSQL (lock-free SKIP LOCKED claims and
# LISTEN/NOTIFY push). Install with:
#   pip install -e ".[postgres]"
postgres = [
    "psycopg[binary]>=3.2",
]
# The injection-capture benchmark's opt-in real-LLM juror (providers.py). The
# core benchmark runs torch-free with no extra installs; this is only needed for
#   python benchmarks/injection_capture/run.py --llm
# Install with: pip install -e ".[benchmark]"
benchmark = [
    "openai>=1.0",
]
# External guardrail baselines scored side-by-side with the quorum on the same
# corpus (benchmarks/injection_capture/baselines.py). Only needed for:
#   python benchmarks/injection_capture/run.py --baselines
# Install with: pip install -e ".[baselines]"
baselines = [
    "guardrails-ai>=0.5",
    "nemoguardrails>=0.9",
]
dev = [
    "pytest>=7.0",
]

[project.urls]
Homepage = "https://github.com/emmanuelesperanca/stigmergic"
Repository = "https://github.com/emmanuelesperanca/stigmergic"
Documentation = "https://github.com/emmanuelesperanca/stigmergic/blob/main/ARCHITECTURE.md"
Issues = "https://github.com/emmanuelesperanca/stigmergic/issues"
Changelog = "https://github.com/emmanuelesperanca/stigmergic/blob/main/CHANGELOG.md"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
